<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>CareerLens AI - Results</title>

    <!-- 1. THE TOOLS: We import the PDF generator here -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <!-- 2. THE DESIGN (CSS): All colors and sizes go here -->
    <style>
        body {
            font-family: sans-serif;
            background-color: #f4f4f9;
            padding: 20px;
            text-align: center;
        }

        .card {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: left;
        }

        .score-box {
            background-color: #667eea;
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 20px;
        }

        .roadmap-box {
            background-color: #f8f9fa;
            padding: 20px;
            border-left: 5px solid #764ba2;
            font-size: 1.1rem;
            line-height: 1.5;
        }

        /* Button Styles */
        .button-area {
            text-align: center;
            margin-top: 30px;
        }

        .btn {
            display: inline-block;
            padding: 10px 20px;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            cursor: pointer;
            border: none;
            font-size: 1rem;
        }

        .btn-blue {
            background-color: #2c3e50;
        }

        .btn-green {
            background-color: #27ae60;
            margin-left: 10px;
        }
    </style>
</head>

<body>
    <h1>🔍 CareerLens AI Analysis Complete</h1>

    <!-- 3. THE STRUCTURE (HTML): The visible boxes on the screen -->
    <div class="card" id="report-card">

        <div class="score-box">
            <h2>ATS Parseability Score: {{ ats_score }} / 100</h2>
            <h2>Job Match Score: {{ match_score }}%</h2>
        </div>

        <h3>✅ Skills Found in Your Resume:</h3>
        <p>{{ skills_found | join(', ') }}</p>

        <h3>🚀 Your Custom AI Career Roadmap:</h3>
        <div class="roadmap-box">{{ roadmap | safe }}</div>

        <!-- The Buttons -->
        <div class="button-area" id="buttons">
            <a href="/applicant" class="btn btn-blue">Analyze Another Resume</a>
            <button onclick="downloadPDF()" class="btn btn-green">💾 Download Report</button>
        </div>

    </div>

    <!-- 4. THE LOGIC (JavaScript): The code that runs when you click the download button -->
    <script>
        function downloadPDF() {
            // Get the HTML pieces we need
            var report = document.getElementById('report-card');
            var buttons = document.getElementById('buttons');

            // Hide the buttons so they don't print on the PDF
            buttons.style.display = 'none';

            // Take a snapshot and save as PDF
            html2pdf().from(report).save('CareerLens_Report.pdf').then(function () {
                // Show the buttons again when finished!
                buttons.style.display = 'block';
            });
        }
    </script>

</body>

</html>
