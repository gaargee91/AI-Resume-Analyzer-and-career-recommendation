<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | CareerLens</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <div class="auth-container">
        <div class="auth-card">
            <h2 class="auth-title">Reset Password</h2>
            <p class="auth-subtitle">Enter your email to receive a secure reset link.</p>

            <!-- If they type an email that doesn't exist, we show them this error -->
            {% if error %}
            <div class="error-msg"
                style="color: red; margin-bottom: 15px; font-weight: bold; background: #ffe6e6; padding: 10px; border-radius: 5px;">
                {{ error }}
            </div>
            {% endif %}

            <!-- If the email is sent successfully, we show this! -->
            {% if success %}
            <div class="success-msg"
                style="color: green; margin-bottom: 15px; font-weight: bold; background: #e2f0d9; padding: 10px; border-radius: 5px;">
                {{ success }}
            </div>
            {% endif %}

            <form action="/forgot-password" method="post" class="auth-form">
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" name="email" required placeholder="name@example.com">
                </div>

                <button type="submit" class="btn btn-blue btn-block">Send Reset Link</button>

            </form>

            <p class="auth-footer" style="margin-top: 20px;">Remembered your password? <a href="/login"
                    style="color: #3498db; text-decoration: none; font-weight: bold;">Log In</a></p>
        </div>
    </div>

</body>

</html>
