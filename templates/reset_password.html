<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password | CareerLens</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <div class="auth-container">
        <div class="auth-card">
            <h2 class="auth-title">Set New Password</h2>

            {% if error %}
            <div class="error-msg"
                style="color: red; margin-bottom: 15px; font-weight: bold; background: #ffe6e6; padding: 10px; border-radius: 5px;">
                {{ error }}
            </div>
            {% endif %}

            <form action="/reset-password" method="post" class="auth-form">
                <!-- We hide the secure token in the form so Python can verify it! -->
                <input type="hidden" name="token" value="{{ token }}">

                <div class="input-group">
                    <label>New Password</label>
                    <input type="password" name="new_password" required minlength="6">
                </div>

                <div class="input-group">
                    <label>Confirm Password</label>
                    <input type="password" name="confirm_password" required minlength="6">
                </div>

                <button type="submit" class="btn btn-blue btn-block">Update Password</button>

            </form>
        </div>
    </div>

</body>

</html>
